# Turn-based speech. Both stages share one Apple GPU.
pipeline: lfm3_omni
model_runner: v2
async_chunk: true
dtype: bfloat16
trust_remote_code: true
enable_prefix_caching: false
connectors:
  codec:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
stages:
- stage_id: 0
  devices: '0'
  enforce_eager: true
  async_scheduling: false
  max_num_seqs: 1
  max_model_len: 1024
  max_num_batched_tokens: 1024
  enable_chunked_prefill: false
  gpu_memory_utilization: 0.6
  kv_cache_memory_bytes: 67108864
  output_connectors:
    to_stage_1: codec
  engine_extras:
    has_sampling_extra_args: true
    shutdown_timeout: 30
  default_sampling_params:
    temperature: 0.0
    max_tokens: 512
    seed: 42
- stage_id: 1
  devices: '0'
  enforce_eager: true
  async_scheduling: false
  skip_tokenizer_init: true
  max_num_seqs: 1
  max_model_len: 1024
  max_num_batched_tokens: 1024
  gpu_memory_utilization: 0.2
  input_connectors:
    from_stage_0: codec
  engine_extras:
    shutdown_timeout: 30
  default_sampling_params:
    temperature: 0.0
    max_tokens: 1

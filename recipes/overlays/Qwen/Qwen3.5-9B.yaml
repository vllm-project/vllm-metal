meta:
  date_updated: "2026-10-27"
  hardware:
    apple_16gb: supported
    apple_32gb: supported
    apple_64gb: supported

features:
  tool_calling:
    hardware_overrides:
      metal:
        args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
  reasoning:
    hardware_overrides:
      metal:
        args: [--reasoning-parser, qwen3]

variants:
  mlx_int4:
    label: MLX 4-bit
    model_id: mlx-community/Qwen3.5-9B-MLX-4bit
    description: Qwen3.5-9B, with room for a conversation of about 6,000 words.
    precision: int4
    # ceil(5,950,062,560 checkpoint bytes / 1e9 * 1.2), not a serving budget.
    vram_minimum_gb: 8
    supported_hardware: [apple_16gb, apple_32gb, apple_64gb]
    min_vllm_version: "0.31.0"
    install:
      pip:
        note: Requires Apple Silicon and macOS 15 or later. Install vLLM Metal.
        command: |
          curl -fsSL https://raw.githubusercontent.com/vllm-project/vllm-metal/main/install.sh | bash
          source ~/.venv-vllm-metal/bin/activate
      docker: false
    supported_frontends: [python]
    supported_features: [tool_calling, reasoning]
    base_args:
      - --host
      - "127.0.0.1"
      - --max-model-len
      - "8192"
      - --max-num-batched-tokens
      - "2048"

notes:
  - title: Memory settings
    when:
      hardware: [apple_16gb, apple_32gb, apple_64gb]
      variants: [mlx_int4]
    body: |
      - The first run downloads 6.0 GB.
      - `--max-num-batched-tokens 2048` reads long text in smaller steps, so the
        model needs less memory. Without it this model does not fit on 16 GB.
      - `--max-model-len 8192` is sized for a real 16 GB Mac. If startup still
        asks for a smaller max seq len, quit other apps or try `4096`.

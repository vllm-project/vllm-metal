name: PR 706 HTTP parity matrix validation
'on':
  push:
    branches:
    - codex/pr706-http-smoke-validation
permissions: {}
jobs:
  parity:
    if: github.repository == 'vllm-project/vllm-metal'
    name: HTTP parity (${{ matrix.os }}, ${{ matrix.model.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: pr706-http-parity-${{ matrix.os }}-${{ matrix.model.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        - macos-26
        model:
        - name: qwen3-0.6b
          id: Qwen/Qwen3-0.6B
          revision: c1899de289a04d12100db370d81485cdf75e47ca
        - name: qwen35-0.8b
          id: Qwen/Qwen3.5-0.8B
          revision: 2fc06364715b967f1860aea9cf38778875588b17
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      VLLM_METAL_MEMORY_FRACTION: '0.65'
      GLOO_SOCKET_IFNAME: lo0
      MODEL_ID: ${{ matrix.model.id }}
      MODEL_REVISION: ${{ matrix.model.revision }}
      TESTED_SHA: c72682f260dbbd6c9f86397de1777cc8fbd662af
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        repository: vllm-project/vllm-metal
        ref: c72682f260dbbd6c9f86397de1777cc8fbd662af
        submodules: recursive
        persist-credentials: false
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      id: models
      with:
        path: ~/.cache/huggingface/hub
        key: parity-hf-${{ runner.os }}-${{ matrix.model.name }}-${{ matrix.model.revision }}
    - name: Install the tested checkout
      run: 'test "$(git rev-parse HEAD)" = "$TESTED_SHA"

        mkdir -p "$RUNNER_TEMP/parity"

        printf ''commit=%s\nmodel=%s\nrevision=%s\n'' "$TESTED_SHA" "$MODEL_ID" "$MODEL_REVISION" > "$RUNNER_TEMP/parity/environment.txt"

        ./install.sh

        '
    - name: Prepare checkpoint
      run: "source .venv-vllm-metal/bin/activate\npython - <<'PY'\nimport importlib.metadata as metadata\nimport os\nimport platform\nimport sys\nfrom huggingface_hub import snapshot_download\nfrom vllm.platforms import current_platform\nassert type(current_platform).__name__ == \"MetalPlatform\", current_platform\nwith open(os.environ[\"RUNNER_TEMP\"] + \"/parity/environment.txt\", \"a\") as f:\n    print(platform.platform(), file=f)\n    print(sys.version, file=f)\n    for package in (\"vllm-metal\", \"vllm\", \"mlx\", \"mlx-lm\"):\n        print(package, metadata.version(package), file=f)\nmodel = snapshot_download(os.environ[\"MODEL_ID\"], revision=os.environ[\"MODEL_REVISION\"])\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as f:\n    print(f\"MODEL_PATH={model}\", file=f)\nPY\n"
    - name: Generate native MLX reference once
      run: "source .venv-vllm-metal/bin/activate\npython - <<'PYREF' 2>&1 | tee \"$RUNNER_TEMP/parity/reference.log\"\nimport json\nimport os\nfrom pathlib import Path\nfrom tools.check_parity import mlx_generate\nfrom tools.parity_prompts import PROMPTS\n\nmodel = os.environ[\"MODEL_PATH\"]\nresults = mlx_generate(model, PROMPTS, max_tokens=20, top_k=5)\nreference = {\"model\": model, \"max_tokens\": 20, \"top_k\": 5, \"results\": results}\nPath(os.environ[\"RUNNER_TEMP\"], \"parity\", \"reference.json\").write_text(json.dumps(reference))\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as output:\n    print(f\"PARITY_MAX_MODEL_LEN={max(len(row['input_ids']) for row in results) + 20}\", file=output)\nPYREF\n"
    - name: Serve once and compare concurrency levels
      run: "source .venv-vllm-metal/bin/activate\n# Give the server and its workers a process group for cleanup.\nset -m\nvllm serve \"$MODEL_PATH\" --host 127.0.0.1 --port 8000 \\\n  --max-model-len \"$PARITY_MAX_MODEL_LEN\" --max-num-seqs 2 \\\n  --no-enable-prefix-caching --generation-config vllm \\\n  > \"$RUNNER_TEMP/parity/serve.log\" 2>&1 &\nserver_pid=$!\ncleanup() {\n  kill -- -\"$server_pid\" 2>/dev/null || true\n  sleep 2\n  kill -KILL -- -\"$server_pid\" 2>/dev/null || true\n  wait \"$server_pid\" 2>/dev/null || true\n}\ntrap cleanup EXIT\nfor ((attempt=0; attempt<60; attempt++)); do\n  kill -0 \"$server_pid\" 2>/dev/null || { cat \"$RUNNER_TEMP/parity/serve.log\"; exit 1; }\n  if curl -fsS --max-time 2 http://127.0.0.1:8000/health > /dev/null 2>&1; then\n    break\n  fi\n  sleep 2\ndone\ncurl -fsS --max-time 5 http://127.0.0.1:8000/health > /dev/null\nprintf '### %s\\n\\nCommit: %s\\n\\n| Concurrency | EXACT | TOP_K_MATCH | FAIL | Exit |\\n|---|---:|---:|---:|---:|\\n' \"$MODEL_ID\"\
        \ \"$TESTED_SHA\" >> \"$GITHUB_STEP_SUMMARY\"\nfailed=0\nfor concurrency in 1 2; do\n  log=\"$RUNNER_TEMP/parity/concurrency-${concurrency}.log\"\n  if python tools/check_parity.py --base-url http://127.0.0.1:8000/v1 --reference \"$RUNNER_TEMP/parity/reference.json\" --concurrency \"$concurrency\" 2>&1 | tee \"$log\"; then\n    code=0\n  else\n    code=$?\n    failed=1\n  fi\n  exact=$(awk '/^EXACT / {n++} END {print n+0}' \"$log\")\n  topk=$(awk '/^TOP_K_MATCH / {n++} END {print n+0}' \"$log\")\n  mismatches=$(awk '/^FAIL / {n++} END {print n+0}' \"$log\")\n  printf '| %s | %s | %s | %s | %s |\\n' \"$concurrency\" \"$exact\" \"$topk\" \"$mismatches\" \"$code\" >> \"$GITHUB_STEP_SUMMARY\"\ndone\nexit \"$failed\"\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: http-parity-${{ matrix.os }}-${{ matrix.model.name }}-c72682f260dbbd6c9f86397de1777cc8fbd662af
        path: ${{ runner.temp }}/parity
        retention-days: 14

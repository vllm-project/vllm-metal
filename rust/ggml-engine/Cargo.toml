[package]
name = "vllm-metal-ggml"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ggml (Metal) model executor for vllm-metal, exposed to Python via PyO3"
publish = false

[lib]
name = "_ggml_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
memmap2 = "0.9"
serde_json = "1"
half = "2.7"
anyhow = "1"

[build-dependencies]
bindgen = "0.73"
pyo3-build-config = "0.29"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
